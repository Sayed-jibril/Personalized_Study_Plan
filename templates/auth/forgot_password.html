{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<!-- Centered Forgot Password Card -->
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-4" style="width: 400px; border-radius: 10px; background-color: #f9f9f9;">
        <div class="text-center mb-4">
            <i class="fas fa-unlock-alt fa-3x text-primary"></i>
            <h3 class="mt-2 font-weight-bold">Forgot Password?</h3>
            <p class="text-muted">Enter your email to reset your password.</p>
        </div>

        <!-- Forgot Password Form -->
        <form method="POST" action="{{ url_for('forgot_password') }}">
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" name="email" id="email" required class="form-control form-control-lg"
                    placeholder="e.g., user@example.com" style="border-radius: 25px; padding-left: 15px;">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg"
                style="border-radius: 25px; background: linear-gradient(45deg, #1e3c72, #2a5298); border: none;">
                <i class="fas fa-paper-plane"></i> Send Reset Link
            </button>
        </form>

        <!-- Back to Login Link -->
        <div class="text-center mt-3">
            <a href="{{ url_for('student_login') }}" class="text-muted">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>
</div>

<!-- Smooth Animation -->
<style>
    .card {
        animation: fadeInUp 0.8s ease-in-out;
    }

    @keyframes fadeInUp {
        0% {
            opacity: 0;
            transform: translateY(20px);
        }

        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
{% endblock %}
