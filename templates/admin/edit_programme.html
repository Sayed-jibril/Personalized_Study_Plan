<!-- templates/admin/edit_programme.html -->
{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white text-center">
                <h3 class="mb-0"><i class="fas fa-edit"></i> Edit Programme: {{ programme.ProgrammeName }}</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <!-- Programme Name -->
                    <div class="form-group">
                        <label for="programme_name"><i class="fas fa-graduation-cap"></i> Programme Name:</label>
                        <input type="text" name="programme_name" id="programme_name" class="form-control"
                            value="{{ programme.ProgrammeName }}" required>
                    </div>

                    <!-- School Selection -->
                    <div class="form-group">
                        <label for="school_id"><i class="fas fa-university"></i> Select School:</label>
                        <select name="school_id" id="school_id" class="form-control" required>
                            <option value="" disabled>Select School</option>
                            {% for school in schools %}
                            <option value="{{ school.SchoolID }}" {% if school.SchoolID==programme.SchoolID %} selected
                                {% endif %}>
                                {{ school.SchoolName }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Description -->
                    <div class="form-group">
                        <label for="description"><i class="fas fa-info-circle"></i> Description:</label>
                        <textarea name="description" id="description" class="form-control"
                            rows="4">{{ programme.Description }}</textarea>
                    </div>

                    <!-- Submit and Back Buttons -->
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-save"></i> Update Programme
                        </button>
                        <a href="{{ url_for('manage_programmes') }}" class="btn btn-secondary btn-lg ml-2">
                            <i class="fas fa-arrow-left"></i> Back to Manage Programmes
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Font Awesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
{% endblock %}
