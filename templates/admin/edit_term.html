<!-- templates/admin/edit_term.html -->
{% extends "base.html" %}

{% block content %}
<h2>Edit Term: Term {{ term.TermNumber }}</h2>
<form method="POST">
    <div class="form-group">
        <label for="term_number">Term Number:</label>
        <input type="number" name="term_number" id="term_number" class="form-control" value="{{ term.TermNumber }}"
            min="1" required>
    </div>
    <div class="form-group">
        <label for="description">Description:</label>
        <textarea name="description" id="description" class="form-control">{{ term.Description }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Update Term</button>
</form>
<br>
<a href="{{ url_for('manage_terms') }}" class="btn btn-secondary">Back to Manage Terms</a>
{% endblock %}
