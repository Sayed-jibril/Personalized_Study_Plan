{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="text-center mb-4">
        <h2 class="display-4"><i class="fas fa-info-circle"></i> Manage Semester Info</h2>
        <p class="lead">Set or edit the current semester details and exam date.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0"><i class="fas fa-edit"></i> Current Semester Information</h5>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('admin_semesterinfo') }}">
                        <div class="form-group">
                            <label for="semester_name">Semester Name</label>
                            <input type="text" name="semester_name" id="semester_name" class="form-control"
                                value="{{ sem_info.SemesterName if sem_info else '' }}" required>
                        </div>
                        <div class="form-group">
                            <label for="start_date">Start Date (YYYY-MM-DD)</label>
                            <input type="date" name="start_date" id="start_date" class="form-control"
                                value="{{ sem_info.Start_Date if sem_info else '' }}" required>
                        </div>
                        <div class="form-group">
                            <label for="end_date">End Date (YYYY-MM-DD)</label>
                            <input type="date" name="end_date" id="end_date" class="form-control"
                                value="{{ sem_info.End_Date if sem_info else '' }}" required>
                        </div>
                        <div class="form-group">
                            <label for="exam_date">Exam Date (YYYY-MM-DD)</label>
                            <input type="date" name="exam_date" id="exam_date" class="form-control"
                                value="{{ sem_info.Exam_Date if sem_info else '' }}" required>
                        </div>
                        <button type="submit" class="btn btn-dark mt-2">
                            <i class="fas fa-save"></i> Save Changes
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Back to Admin Dashboard -->
    <div class="text-center mt-4">
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-dark">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
    </div>
</div>

<!-- Font Awesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
{% endblock %}
