<!-- templates/admin/update_prerequisites.html -->
{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <!-- Header -->
    <div class="text-center mb-4">
        <h2 class="display-4"><i class="fas fa-sync-alt"></i> Update Prerequisites</h2>
        <p class="lead">Manage prerequisites for {{ course.CourseCode }} - {{ course.CourseName }}</p>
    </div>

    <!-- Update Prerequisites Form -->
    <div class="row justify-content-center">
        <div class="col-lg-8 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-edit"></i> Update Prerequisites</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <!-- Prerequisites Selection -->
                        <div class="form-group">
                            <label for="prerequisites"><i class="fas fa-check-square"></i> Select Prerequisites:</label>
                            <div class="card p-3" style="max-height: 400px; overflow-y: auto;">
                                <div class="row">
                                    {% for course_item in all_courses %}
                                    <div class="col-md-6 mb-2">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="prerequisites"
                                                value="{{ course_item.CourseCode }}" id="{{ course_item.CourseCode }}"
                                                {% if course_item.CourseCode in current_prereqs %} checked {% endif %}>
                                            <label class="form-check-label" for="{{ course_item.CourseCode }}">
                                                {{ course_item.CourseCode }} - {{ course_item.CourseName }}
                                            </label>
                                        </div>
                                    </div>
                                    {% endfor %}
                                </div>
                            </div>
                        </div>
                        <!-- Submit Button -->
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save"></i> Update Prerequisites
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Back to Manage Courses Button -->
    <div class="text-center mt-4">
        <a href="{{ url_for('manage_courses') }}" class="btn btn-secondary btn-lg">
            <i class="fas fa-arrow-left"></i> Back to Manage Courses
        </a>
    </div>
</div>

<!-- Font Awesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
{% endblock %}
