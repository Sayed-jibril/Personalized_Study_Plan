<!-- templates/admin/edit_school.html -->
{% extends "base.html" %}

{% block content %}
<h2>Edit School: {{ school.SchoolName }}</h2>
<form method="POST">
    <div class="form-group">
        <label for="school_name">School Name:</label>
        <input type="text" name="school_name" id="school_name" class="form-control" value="{{ school.SchoolName }}"
            required>
    </div>
    <div class="form-group">
        <label for="description">Description:</label>
        <textarea name="description" id="description" class="form-control">{{ school.Description }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Update School</button>
</form>
<br>
<a href="{{ url_for('manage_schools') }}" class="btn btn-secondary">Back to Manage Schools</a>
{% endblock %}
