<!-- templates/admin/edit_course.html -->
{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white text-center">
                <h3 class="mb-0"><i class="fas fa-edit"></i> Edit Course: {{ course.CourseCode }} - {{ course.CourseName
                    }}</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <!-- Course Code -->
                    <div class="form-group">
                        <label for="course_code"><i class="fas fa-code"></i> Course Code:</label>
                        <input type="text" name="course_code" id="course_code" class="form-control"
                            value="{{ course.CourseCode }}" required>
                    </div>

                    <!-- Course Name -->
                    <div class="form-group">
                        <label for="course_name"><i class="fas fa-book"></i> Course Name:</label>
                        <input type="text" name="course_name" id="course_name" class="form-control"
                            value="{{ course.CourseName }}" required>
                    </div>

                    <!-- Credit Hours -->
                    <div class="form-group">
                        <label for="credit_hours"><i class="fas fa-credit-card"></i> Credit Hours:</label>
                        <input type="number" name="credit_hours" id="credit_hours" class="form-control"
                            value="{{ course.CreditHours }}" min="1" required>
                    </div>

                    <!-- Programme Selection -->
                    <div class="form-group">
                        <label for="programme_id"><i class="fas fa-graduation-cap"></i> Select Programme:</label>
                        <select name="programme_id" id="programme_id" class="form-control" required>
                            <option value="" disabled>Select Programme</option>
                            {% for programme in programmes %}
                            <option value="{{ programme.ProgrammeID }}" {% if programme.ProgrammeID==course.ProgrammeID
                                %} selected {% endif %}>
                                {{ programme.ProgrammeName }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Semester Selection -->
                    <div class="form-group">
                        <label for="semester_id"><i class="fas fa-calendar-alt"></i> Select Semester:</label>
                        <select name="semester_id" id="semester_id" class="form-control" required>
                            <option value="" disabled>Select Semester</option>
                            {% for semester in semesters %}
                            <option value="{{ semester.SemesterID }}" {% if semester.SemesterID==course.SemesterID %}
                                selected {% endif %}>
                                {{ semester.Description }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Category Selection -->
                    <div class="form-group">
                        <label for="category"><i class="fas fa-list"></i> Category:</label>
                        <select name="category" id="category" class="form-control" required>
                            <option value="" disabled>Select Category</option>
                            <option value="mpu" {% if course.Category=='mpu' %} selected {% endif %}>MPU</option>
                            <option value="university_compulsory" {% if course.Category=='university_compulsory' %} selected {% endif %}>University Compulsory</option>
                            <option value="core_computing" {% if course.Category=='core_computing' %} selected {% endif %}>Core Computing</option>
                            <option value="discipline_core" {% if course.Category=='discipline_core' %} selected {% endif %}>Discipline Core</option>
                            <option value="field_elective" {% if course.Category=='field_elective' %} selected {% endif %}>Field Elective</option>
                            <option value="free_elective" {% if course.Category=='free_elective' %} selected {% endif %}>Free Elective</option>
                            <option value="project" {% if course.Category=='project' %} selected {% endif %}>Project</option>
                            <option value="free_elective" {% if course.Category=='industrial_training' %} selected {% endif %}>Industrial Training</option>
                        </select>
                    </div>

                    <!-- Prerequisites Selection -->
                    <div class="form-group">
                        <label for="prerequisites"><i class="fas fa-check-square"></i> Select Prerequisites:</label>
                        <div class="card p-3">
                            {% for course_item in existing_courses %}
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="prerequisites"
                                    value="{{ course_item.CourseCode }}" id="{{ course_item.CourseCode }}" {% if
                                    course_item.CourseCode in current_prereqs %} checked {% endif %}>
                                <label class="form-check-label" for="{{ course_item.CourseCode }}">
                                    {{ course_item.CourseCode }} - {{ course_item.CourseName }}
                                </label>
                            </div>
                            {% endfor %}
                        </div>
                    </div>

                    <!-- Submit and Back Buttons -->
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-save"></i> Update Course
                        </button>
                        <a href="{{ url_for('manage_courses') }}" class="btn btn-secondary btn-lg ml-2">
                            <i class="fas fa-arrow-left"></i> Back to Manage Courses
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Font Awesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
{% endblock %}
