<!-- templates/add_course.html -->
{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white text-center">
                <h3 class="mb-0"><i class="fas fa-plus-circle"></i> Add New Course</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <!-- Course Code -->
                    <div class="form-group">
                        <label for="course_code"><i class="fas fa-code"></i> Course Code:</label>
                        <input type="text" name="course_code" id="course_code" class="form-control"
                            placeholder="e.g., CS101" required>
                    </div>

                    <!-- Course Name -->
                    <div class="form-group">
                        <label for="course_name"><i class="fas fa-book"></i> Course Name:</label>
                        <input type="text" name="course_name" id="course_name" class="form-control"
                            placeholder="e.g., Introduction to Computer Science" required>
                    </div>

                    <!-- Credit Hours -->
                    <div class="form-group">
                        <label for="credit_hours"><i class="fas fa-credit-card"></i> Credit Hours:</label>
                        <input type="number" name="credit_hours" id="credit_hours" class="form-control" min="1"
                            placeholder="e.g., 3" required>
                    </div>

                    <!-- Programme Selection -->
                    <div class="form-group">
                        <label for="programme_id"><i class="fas fa-graduation-cap"></i> Select Programme:</label>
                        <select name="programme_id" id="programme_id" class="form-control" required>
                            <option value="" disabled selected>Select Programme</option>
                            {% for programme in programmes %}
                            <option value="{{ programme.ProgrammeID }}">{{ programme.ProgrammeName }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Semester Selection -->
                    <div class="form-group">
                        <label for="semester_id"><i class="fas fa-calendar-alt"></i> Select Semester:</label>
                        <select name="semester_id" id="semester_id" class="form-control" required>
                            <option value="" disabled selected>Select Semester</option>
                            {% for semester in semesters %}
                            <option value="{{ semester.SemesterID }}">{{ semester.Description }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Category Selection -->
                    <div class="form-group">
                        <label for="category"><i class="fas fa-list"></i> Category:</label>
                        <select name="category" id="category" class="form-control" required>
                            <option value="" disabled selected>Select Category</option>
                            <option value="Core">Core</option>
                            <option value="Elective">Elective</option>
                        </select>
                    </div>

                    <!-- Prerequisites Selection -->
                    <div class="form-group">
                        <label><i class="fas fa-check-square"></i> Select Prerequisites:</label>
                        <div class="card p-3">
                            {% for course in existing_courses %}
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="prerequisites"
                                    value="{{ course.CourseCode }}" id="{{ course.CourseCode }}">
                                <label class="form-check-label" for="{{ course.CourseCode }}">
                                    {{ course.CourseCode }} - {{ course.CourseName }}
                                </label>
                            </div>
                            {% endfor %}
                        </div>
                    </div>

                    <!-- Submit and Back Buttons -->
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-plus"></i> Add Course
                        </button>
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary btn-lg ml-2">
                            <i class="fas fa-arrow-left"></i> Back to Dashboard
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Font Awesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
{% endblock %}
